<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Notes</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1c1c1c, #2c2c2c);
            color: white;
            min-height: 100vh;
        }

        /* NAVBAR */
        .nav {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #00ff88;
            text-align: center;
            padding: 15px;
            z-index: 1000;
        }

        .nav h1 {
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* MAIN CONTAINER */
        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* NOTE CARD */
        .note {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111;
            border: 1px solid #00ff88;
            padding: 15px 18px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: 0.3s ease;
        }

        .note:hover {
            background: #003d26;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 255, 136, 0.3);
        }

        .note i {
            color: #ffd700;
            font-size: 18px;
        }

        .note span {
            flex: 1;
            margin-left: 12px;
            font-size: 15px;
        }

        .note .arrow {
            font-size: 14px;
            opacity: 0.7;
        }

        /* AI BUTTON */
        .ai {
            position: fixed;
            right: 10px;
            bottom: 120px;
            z-index: 1001;
        }

        .ai img {
            width: 80px;
        }

        /* AD SECTION */
        .ad {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 90px;
        }

        .ad img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* RESPONSIVE */
        @media (max-width: 500px) {
            .note {
                padding: 12px;
            }

            .note span {
                font-size: 14px;
            }

            .ai img {
                width: 100px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="nav">
        <h1>Physics Notes</h1>
    </div>

    <!-- AI BUTTON -->
    <a href="https://bhavesh189.github.io/DocAna/" class="ai">
        <img src="docana.png" alt="AI Tool">
    </a>

    <!-- NOTES -->
    <div class="container">

        <a href="UNIT-1(WAVE OPTICS).pdf" class="note">
            <i class="fas fa-book"></i>
            <span>Unit 1 - Wave Optics</span>
            <i class="fas fa-arrow-right arrow"></i>
        </a>

        <a href="#" class="note">
            <i class="fas fa-book"></i>
            <span>Unit 2 - (Uploading Soon)</span>
            <i class="fas fa-clock arrow"></i>
        </a>

        <a href="UNIT-3(LASER).pdf" class="note">
            <i class="fas fa-book"></i>
            <span>Unit 3 - Laser</span>
            <i class="fas fa-arrow-right arrow"></i>
        </a>

        <a href="UNIT-4(SEMICONDUUCTORS).pdf" class="note">
            <i class="fas fa-book"></i>
            <span>Unit 4 - Semiconductors</span>
            <i class="fas fa-arrow-right arrow"></i>
        </a>

        <a href="UNIT-5(INTRO TO ELECTROMAGNETISM).pdf" class="note">
            <i class="fas fa-book"></i>
            <span>Unit 5 - Electromagnetism</span>
            <i class="fas fa-arrow-right arrow"></i>
        </a>

    </div>

    <!-- AD -->
    <div class="ad">
        <a href="https://bhavesh189.github.io/EnterNet/home.html">
            <img src="ad.png" alt="Advertisement">
        </a>
    </div>

</body>

</html>
