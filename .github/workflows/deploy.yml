name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] 

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:  
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject Secrets
        run: |
          if [ -f add.js ]; then
            sed -i 's/teri_esi_ki_tesi_api_dekhega/${{ secrets.TG_API }}/g' add.js
            sed -i 's/teri_esi_ki_tesi_address_dekhega/${{ secrets.TG_ID }}/g' add.js
          else
            echo "add.js not present; skipping Telegram secret injection"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
          cp CNAME dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4