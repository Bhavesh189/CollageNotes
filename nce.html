        * {

        body {
            background: rgb(37, 36, 36);
            color: white;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .nav {
            background-color: black;
            border: 2px solid greenyellow;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.2);

            top: 0;
            z-index: 1000;
            width: 100%;
        }

        .nav h1 {
            color: white;
            text-align: center;
            padding: 15px;
        }

        .notes {
            margin-top: 30px;
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notes .name {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid rgb(0, 255, 0);
            padding: 10px;
            border-radius: 15px;
            background-color: rgb(20, 20, 20);
            cursor: pointer;
            transition: 0.3s ease-in-out;
        }

        .name:hover {
            background-color: rgb(0, 51, 0);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .name i {
            font-size: 24px;
            color: yellow;
        }

        .ad {
            height: 25%;
            width: 100%;
            cursor: pointer;
            position: fixed;
            bottom: 0;
        }

        .ad img {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }

        .notes a {
            text-decoration: none;
        }

        .notes a h4 {
            color: white;
        }

        .ai {
            position: fixed;
            bottom: 30%;
            right: 0;
            width: 150px;
            height: 50px;
            cursor: pointer;
            z-index: 1001;
            height: 50px;
            width: 150px;
        }

        .ai img {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }
    </style>
