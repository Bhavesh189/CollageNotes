<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhavesh189</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #050505;
            color: white;
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(38, 147, 249, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(38, 147, 249, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 90%);
        }

        .container {
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 500px;
        }

        .icon-box {
            font-size: 3.5rem;
            color: rgb(38, 147, 249);
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(38, 147, 249, 0.6);
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 15px;
            line-height: 1.2;
        }
        
        h1 span {
            color: rgb(38, 147, 249);
            -webkit-text-stroke: 1px rgb(38, 147, 249);
            text-shadow: 0 0 15px rgba(38, 147, 249, 0.8);
            display: block;
        }

        .typing-text {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 30px;
            min-height: 40px;
            padding: 0 10px;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 10px;
            margin: 0 auto 40px auto;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgb(38, 147, 249), #00e5ff);
            border-radius: 10px;
            animation: load 2.5s ease-in-out infinite;
            box-shadow: 0 0 10px rgb(38, 147, 249);
        }

        .btn {
            text-decoration: none;
            color: #25D366; 
            border: 2px solid #25D366;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            transition: 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.5);
        }

        .btn:hover {
            background-color: #25D366;
            color: black;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.6);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes load {
            0% { width: 0%; transform: translateX(-100%); }
            50% { width: 50%; }
            100% { width: 100%; transform: translateX(100%); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <i class="fa-solid fa-code"></i>
        </div>

        <h1>WEBSITE IS <span class="net">DEVELOPING</span></h1>

        <p class="typing-text" id="typewriter"></p>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <a href="https://wa.me/916376411796" class="btn" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> Contact Owner
        </a>
    </div>

    <script>
        const textElement = document.getElementById('typewriter');
        const textToType = "We are currently upgrading the system...";
        let index = 0;

        function typeText() {
            if (index < textToType.length) {
                textElement.innerHTML += textToType.charAt(index);
                index++;
                setTimeout(typeText, 50);
            } else {
                setTimeout(() => {
                    textElement.innerHTML = "";
                    index = 0;
                    typeText();
                }, 2000);
            }
        }

        window.onload = typeText;
    </script>

</body>
</html>
