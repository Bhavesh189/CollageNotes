<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Notes</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YJFYSR5VKS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-YJFYSR5VKS');
    </script>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'poppins', sans-serif;
        }
        body {
            background : rgb(37, 36, 36);
            color : white;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        .nav {
            background-color: black;
            border : 2px solid greenyellow;
            border-radius : 5px;
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }

        .nav h1 {
            color: white;
            text-align: center;
            padding: 15px;
        }
        
        .notes {
            margin-top: 30px;
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notes .name {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid rgb(0, 255, 0);
            padding: 10px;
            border-radius: 15px;
            background-color: rgb(20, 20, 20);
            cursor: pointer;
            transition: 0.3s ease-in-out;
        }
        .name:hover {
            background-color: rgb(0, 51, 0);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .name i {
            font-size: 24px;
            color: yellow;
        }
        .ad {
            height : 25%;
            width : 100%;
            cursor : pointer;
            position : fixed;
            bottom : 0;
        }
        .ad img {
            height : 100%;
            width : 100%;
            object-fit : cover;
        }
        .notes a {
            text-decoration : none;
        }
        .notes a h4 {
            color : white;
        }
    </style>
</head>
<body>
    <div class="nav">
        <h1>Maths Notes</h1>
    </div>

    <div class="notes">

        <a href="b.pdf">
            <div class="name">
                <i class="fa-solid fa-file-pdf"></i>
                <h4>1. Ex 36 to Ex 41</h4>
                <i class="fa-solid fa-download"></i>
            </div>
        </a>

        <a href="f.pdf">
            <div class="name">
                <i class="fa-solid fa-file-pdf"></i>
                <h4>2. Maths Full Book Answers</h4>
                <i class="fa-solid fa-download"></i>
            </div>
        </a>

        <a href="https://acrobat.adobe.com/id/urn:aaid:sc:AP:9c2918d3-b1b4-4410-9ddf-2162308daee1">
            <div class="name">
                <i class="fa-solid fa-file-pdf"></i>
                <h4>3. Maths Assignment</h4>
                <i class="fa-solid fa-download"></i>
            </div>
        </a>

    </div>

    <div class="ad">
        <a href="https://bhavesh189.github.io/EnterNet/home.html">
            <img src="ad.png" alt="Watch Movies on EnterNet">
        </a>
    </div>
</body>
</html>
