    <!-- Apply the saved (or system) theme before first paint — no flash -->
    <script>
      try {
        var t = localStorage.getItem('bn-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* storage unavailable — light theme stays */ }
    </script>
    <title>Bhavesh Notes — B.Tech CSE Notes, Syllabus &amp; PYQs</title>
    <meta name="description" content="Free B.Tech CSE notes, official BTU syllabus and previous year question papers — semester-wise, view or download." />
    <!-- Google Analytics 4 — Measurement ID G-NT7F2EBRZV (stream "Notes
         Website", https://notes.thebhavesh.online/). A GA Measurement ID
         is public by design — it appears in page source. GA data can take
         up to 48h to appear in reports; the tag firing (gtag/collect
         requests) is the verification. See GA-SETUP.md. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NT7F2EBRZV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){window.dataLayer.push(arguments);}
      gtag('js', new Date());
      // send_page_view:false — the app sends page_view itself on every
      // SPA navigation (see App.jsx), otherwise GA would count only the
      // first load.
      gtag('config', 'G-NT7F2EBRZV', { send_page_view: false });
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Poppins:wght@300;400;500;600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- FontAwesome Icons -->
    <!-- Font Awesome is bundled locally (npm) so icons render without a CDN -->
    <!-- Service worker (PWA): caches the app shell + opened note pages so
         recently read notes work offline. Registered late so it never
         blocks first paint. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () { /* offline-capable browsers only */ });
        });
      }
    </script>
